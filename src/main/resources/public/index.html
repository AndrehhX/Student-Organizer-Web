<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Organizer | Iniciar sesión</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<main class="contenedor-principal">
    <section class="tarjeta-login" aria-labelledby="titulo-login">
        <div class="marca">SO</div>
        <p class="etiqueta">STUDENT ORGANIZER</p>
        <h1 id="titulo-login">Bienvenido</h1>
        <p class="subtitulo">Inicia sesión para organizar tus actividades académicas.</p>

        <form id="login-form" novalidate>
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username"
                   placeholder="Escribe tu usuario">

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="contrasena" type="password"
                   autocomplete="current-password" placeholder="Escribe tu contraseña">

            <button type="submit">Iniciar sesión</button>
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        </form>

        <p class="enlace-registro">
            ¿No tienes una cuenta?
            <button id="mostrar-registro" class="boton-enlace" type="button">
                Crear cuenta
            </button>
        </p>

        <form id="registro-form" hidden novalidate>
            <h2>Crear cuenta</h2>

            <label for="registro-usuario">Usuario</label>
            <input id="registro-usuario" name="usuario" type="text"
                   autocomplete="username" placeholder="Elige un usuario">

            <label for="registro-contrasena">Contraseña</label>
            <input id="registro-contrasena" name="contrasena" type="password"
                   autocomplete="new-password" placeholder="Elige una contraseña">

            <label for="registro-carne">Carné</label>
            <input id="registro-carne" name="carne" type="text"
                   placeholder="Escribe tu carné">

            <button type="submit">Registrarme</button>
            <p id="registro-mensaje" class="mensaje"
               role="status" aria-live="polite"></p>
        </form>

    </section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
